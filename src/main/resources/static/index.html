<!DOCTYPE html>
<html>
  <head>
    <title>FlowSense MPC Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>FlowSense MPC Dashboard</h1>

    <div class="box">
      <h2>Send Measurement</h2>
      <label>Sensor Type:</label>
      <select id="sensorId">
        <option value="turbidity_sensor_1">Turbidity (NTU)</option>
        <option value="flow_sensor_1">Flow Rate (m³/hr)</option>
        <option value="temp_sensor_1">Temperature (°C)</option>
        <option value="do_sensor_1">Dissolved Oxygen (mg/L)</option>
      </select>

      <label>Value:</label>
      <input id="sensorValue" type="number" value="15.0" />

      <button onclick="sendMeasurement()">Send</button>
    </div>

    <div class="box">
      <h2>Recent Measurements</h2>
    <label>View Sensor:</label>
    <select id="viewSensorId">
        <option value="turbidity_sensor_1">Turbidity (NTU)</option>
        <option value="flow_sensor_1">Flow Rate (m³/hr)</option>
        <option value="temp_sensor_1">Temperature (°C)</option>
        <option value="do_sensor_1">Dissolved Oxygen (mg/L)</option>
    </select>
    <button onclick="loadMeasurements()">Load</button>

      <table id="dataTable">
        <tr>
          <th>Timestamp</th>
          <th>Value</th>
        </tr>
      </table>
    </div>

    <h2>Predictive Control</h2>

    <label>Select Sensor:</label>
    <select id="controlSensorId">
        <option value="turbidity_sensor_1">Turbidity (NTU)</option>
        <option value="flow_sensor_1">Flow Rate (m³/hr)</option>
        <option value="temp_sensor_1">Temperature (°C)</option>
        <option value="do_sensor_1">Dissolved Oxygen (mg/L)</option>
    </select>

    <button onclick="loadLatestState()">Load Latest Values</button>

    <label>Reference:</label>
    <input id="ref" />

    <label>y(k):</label>
    <input id="yk" readonly />

    <label>y(k-1):</label>
    <input id="yk1" readonly />

    <label>u(k-1):</label>
    <input id="uk" readonly />

    <button onclick="computeControl()">Compute Control</button>

    <p>Control Output u(k): <span id="controlOutput"></span></p>

    <script src="app.js"></script>
  </body>
</html>
